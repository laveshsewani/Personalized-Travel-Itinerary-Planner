[project]
name = "travel-itinerary-planner-backend"
version = "1.0.0"
description = "FastAPI backend for Personalized Travel Itinerary Planner"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
